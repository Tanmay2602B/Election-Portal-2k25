name: Keep Render Backend Alive

on:
  schedule:
    # Run every 12 minutes (Render free tier sleeps after 15 min of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          URL="https://council-selections-portal.onrender.com/health"
          echo "Sending health check request to $URL..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" "$URL")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Render backend is active and responded with HTTP $STATUS."
          else
            echo "⚠️ Health check responded with HTTP $STATUS. Backend may be waking up."
          fi
